    <style>
        /* =========================================================
           VARIABLES
        ========================================================= */
        :root {
            --rosa-profundo: #9c526d;
            --rosa: #c97996;
            --rosa-medio: #d995ac;
            --rosa-palo: #e8b9c8;
            --rosa-claro: #f7e2e9;
            --rosa-suave: #fff5f8;
            --rosa-fondo: #fdf6f8;

            --dorado: #c7a14a;
            --dorado-claro: #ead79d;
            --dorado-suave: #f5e8bf;
            --dorado-oscuro: #967328;

            --vino: #6e394e;
            --vino-oscuro: #4d2435;
            --texto: #5a4149;
            --texto-suave: #7a6068;
            --blanco: #ffffff;

            --sombra: 0 20px 50px rgba(117, 65, 82, .12);
            --sombra-suave: 0 10px 30px rgba(117, 65, 82, .08);
            --radio: 24px;
            --transicion: .4s cubic-bezier(.25, .8, .25, 1);
        }

        /* =========================================================
           RESET & BASE
        ========================================================= */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--texto);
            background: var(--rosa-fondo);
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        img {
            max-width: 100%;
            display: block;
        }

        button, input, select, textarea {
            font-family: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================================================
           FONDO DECORATIVO
        ========================================================= */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -2;
            background:
                radial-gradient(ellipse at 8% 12%, rgba(232,185,200,.22), transparent 30%),
                radial-gradient(ellipse at 92% 28%, rgba(234,215,157,.12), transparent 26%),
                radial-gradient(ellipse at 50% 88%, rgba(217,149,172,.15), transparent 32%);
        }

        /* =========================================================
           PARTÍCULAS (PÉTALOS)
        ========================================================= */
        .petals {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 20;
        }

        .petal {
            position: absolute;
            width: 9px;
            height: 14px;
            background: linear-gradient(135deg, rgba(255,255,255,.85), rgba(232,185,200,.6));
            border-radius: 100% 0 100% 0;
            animation: caer linear infinite;
            filter: blur(.3px);
            opacity: .7;
        }

        .petal:nth-child(1) { left: 6%;  animation-duration: 14s; animation-delay: -1s; }
        .petal:nth-child(2) { left: 18%; animation-duration: 17s; animation-delay: -7s; width: 7px; height: 11px; }
        .petal:nth-child(3) { left: 35%; animation-duration: 13s; animation-delay: -4s; }
        .petal:nth-child(4) { left: 52%; animation-duration: 19s; animation-delay: -11s; width: 10px; height: 15px; }
        .petal:nth-child(5) { left: 68%; animation-duration: 15s; animation-delay: -3s; }
        .petal:nth-child(6) { left: 82%; animation-duration: 16s; animation-delay: -9s; width: 8px; height: 12px; }
        .petal:nth-child(7) { left: 94%; animation-duration: 18s; animation-delay: -5s; }

        @keyframes caer {
            0%   { transform: translateY(-15vh) rotate(0deg) scale(.8); opacity: 0; }
            12%  { opacity: .75; }
            100% { transform: translateY(115vh) translateX(70px) rotate(420deg) scale(1); opacity: 0; }
        }

        /* =========================================================
           APERTURA
        ========================================================= */
        .opening {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 40%,
                    rgba(255,255,255,.98) 0%,
                    rgba(255,245,248,.97) 40%,
                    rgba(232,185,200,.95) 100%);
            transition: opacity 1.1s ease, visibility 1.1s ease, transform 1.1s ease;
        }

        .opening.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(1.03);
        }

        .opening-card {
            width: min(92%, 480px);
            text-align: center;
            padding: 52px 32px 48px;
            border: 1px solid rgba(199,161,74,.4);
            background: linear-gradient(160deg, rgba(255,255,255,.95), rgba(255,241,246,.9));
            box-shadow:
                0 35px 90px rgba(111,57,78,.16),
                inset 0 0 0 10px rgba(255,255,255,.4);
            position: relative;
            border-radius: 4px;
        }

        .opening-card::before,
        .opening-card::after {
            content: "✦";
            position: absolute;
            color: var(--dorado);
            font-size: 18px;
            opacity: .85;
        }

        .opening-card::before { top: 16px; left: 20px; }
        .opening-card::after  { bottom: 16px; right: 20px; }

        .opening-ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 20px;
            color: var(--dorado);
            font-size: 11px;
            letter-spacing: 6px;
        }

        .opening-ornament::before,
        .opening-ornament::after {
            content: "";
            width: 36px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--dorado));
        }

        .opening-ornament::after {
            background: linear-gradient(90deg, var(--dorado), transparent);
        }

        .opening-kicker {
            font-size: 10px;
            letter-spacing: 4.5px;
            text-transform: uppercase;
            color: var(--dorado-oscuro);
            margin-bottom: 18px;
            font-weight: 500;
        }

        .opening-name {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(56px, 14vw, 92px);
            line-height: 1.08;
            padding: 0 10px 10px;
            background: linear-gradient(100deg, var(--rosa-profundo), var(--dorado), var(--rosa-profundo));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: brilloNombre 5.5s ease-in-out infinite;
        }

        @keyframes brilloNombre {
            0%, 100% { filter: drop-shadow(0 3px 6px rgba(156,82,109,.1)); }
            50%      { filter: drop-shadow(0 6px 14px rgba(199,161,74,.32)); }
        }

        .opening-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--vino);
            margin: 8px 0 18px;
            font-weight: 500;
        }

        .opening-date {
            font-size: 11px;
            letter-spacing: 3.5px;
            color: var(--rosa-profundo);
            margin-bottom: 32px;
            font-weight: 500;
        }

        .open-btn {
            border: 1px solid rgba(199,161,74,.6);
            background: linear-gradient(135deg, var(--rosa-profundo), var(--rosa));
            color: white;
            padding: 15px 36px;
            border-radius: 50px;
            font-size: 10px;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 12px 28px rgba(156,82,109,.28);
            transition: var(--transicion);
            font-weight: 500;
        }

        .open-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 36px rgba(156,82,109,.35);
        }

        .open-btn:active {
            transform: translateY(-1px);
        }

        /* =========================================================
           MÚSICA
        ========================================================= */
        .music-btn {
            position: fixed;
            right: 18px;
            bottom: 18px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.65);
            background: linear-gradient(135deg, var(--rosa-profundo), var(--rosa));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 10px 26px rgba(111,57,78,.28);
            transition: var(--transicion);
            font-size: 18px;
        }

        .music-btn:hover {
            transform: scale(1.08);
        }

        .music-btn.playing {
            animation: pulseMusic 2.2s ease-in-out infinite;
        }

        @keyframes pulseMusic {
            0%, 100% { box-shadow: 0 10px 26px rgba(111,57,78,.28); }
            50%      { box-shadow: 0 10px 32px rgba(156,82,109,.45); }
        }

        /* =========================================================
           WHATSAPP
        ========================================================= */
        .whatsapp-btn {
            position: fixed;
            right: 18px;
            bottom: 80px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #25D366;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 10px 26px rgba(37, 211, 102, .35);
            transition: var(--transicion);
            text-decoration: none;
        }

        .whatsapp-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 14px 32px rgba(37, 211, 102, .45);
        }

        .whatsapp-btn svg {
            width: 26px;
            height: 26px;
            fill: white;
        }

        .whatsapp-btn-text {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 22px;
            padding: 14px 28px;
            border-radius: 50px;
            background: #25D366;
            color: white;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 500;
            box-shadow: 0 10px 24px rgba(37, 211, 102, .3);
            transition: var(--transicion);
            text-decoration: none;
        }

        .whatsapp-btn-text:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 30px rgba(37, 211, 102, .4);
        }

        .whatsapp-btn-text svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 8px;
        }

        .btn-waze {
            background: linear-gradient(135deg, #33ccff, #0099cc) !important;
            box-shadow: 0 10px 24px rgba(0, 153, 204, .28) !important;
        }

        .btn-waze:hover {
            box-shadow: 0 14px 30px rgba(0, 153, 204, .38) !important;
        }

        .btn-calendar {
            background: linear-gradient(135deg, var(--dorado-oscuro), var(--dorado)) !important;
            box-shadow: 0 10px 24px rgba(150, 115, 40, .28) !important;
        }

        .btn-calendar:hover {
            box-shadow: 0 14px 30px rgba(150, 115, 40, .38) !important;
        }

        .calendar-wrapper {
            text-align: center;
            margin-top: 36px;
        }




        /* =====================================================
           TARJETA PERSONALIZADA + FORMULARIO BLOQUEADO
           Ejemplo: index.html?nombre=Familia%20López&pases=3
        ===================================================== */
        (function () {
            const params = new URLSearchParams(window.location.search);
            const nombre = params.get('nombre') || params.get('name') || params.get('para');
            const pases  = params.get('pases') || params.get('invitados') || params.get('passes');

            const card = document.getElementById('personalCard');
            const nameEl = document.getElementById('guestName');
            const passesEl = document.getElementById('passesCount');
            const passesWrap = document.getElementById('guestPasses');

            const inputNombre = document.getElementById('nombre');
            const selectPases = document.getElementById('pases');
            const selectAsistencia = document.getElementById('asistencia');

            // --- Tarjeta personalizada ---
            if (nombre && nombre.trim()) {
                nameEl.textContent = nombre.trim();
                card.classList.add('visible');

                if (pases && !isNaN(parseInt(pases)) && parseInt(pases) > 0) {
                    const n = parseInt(pases);
                    passesEl.textContent = n;
                    passesWrap.innerHTML = (n === 1)
                        ? 'Pase: <strong>1</strong>'
                        : 'Pases: <strong>' + n + '</strong>';
                } else {
                    passesWrap.style.display = 'none';
                }
            }

            // --- Formulario: nombre ---
            if (inputNombre && nombre && nombre.trim()) {
                inputNombre.value = nombre.trim();
            }

            // --- Formulario: pases BLOQUEADOS ---
            if (selectPases && pases && !isNaN(parseInt(pases)) && parseInt(pases) > 0) {
                const n = String(parseInt(pases));

                // Limpiar opciones y dejar solo la asignada
                selectPases.innerHTML = '';
                const opt = document.createElement('option');
                opt.value = n;
                opt.textContent = n === '1' ? '1 persona (asignada)' : n + ' personas (asignadas)';
                opt.selected = true;
                selectPases.appendChild(opt);

                // Bloquear para que no se pueda cambiar
                selectPases.disabled = true;
                selectPases.style.opacity = '0.85';
                selectPases.style.cursor = 'not-allowed';
                selectPases.style.background = '#f0e6ea';

                // Campo oculto para que el valor sí se envíe (disabled no se envía)
                let hidden = document.getElementById('pasesHidden');
                if (!hidden) {
                    hidden = document.createElement('input');
                    hidden.type = 'hidden';
                    hidden.id = 'pasesHidden';
                    hidden.name = 'pases';
                    selectPases.parentNode.appendChild(hidden);
                }
                hidden.value = n;

                // Quitar el name del select deshabilitado para no duplicar
                selectPases.removeAttribute('name');
            }

            // Preseleccionar "Sí"
            if (selectAsistencia && pases) {
                selectAsistencia.value = 'Si';
            }

            // --- Validación extra al enviar ---
            const form = document.getElementById('rsvpForm');
            if (form) {
                form.addEventListener('submit', function (e) {
                    const assigned = pases ? parseInt(pases) : null;
                    const hidden = document.getElementById('pasesHidden');
                    const current = hidden ? parseInt(hidden.value) : (selectPases ? parseInt(selectPases.value) : null);

                    if (assigned && current && current !== assigned) {
                        e.preventDefault();
                        alert('El número de pases no coincide con los asignados (' + assigned + ').');
                        return false;
                    }

                    if (assigned && (!current || current < 1)) {
                        e.preventDefault();
                        alert('Debes confirmar con los pases asignados (' + assigned + ').');
                        return false;
                    }
                }, true);
            }
        })();

    </script>
